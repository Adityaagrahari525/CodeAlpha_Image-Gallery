<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#edf3f0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <header class="page-header">
            <p class="eyebrow">A little collection</p>
            <h1>Image gallery<span>.</span></h1>
            <p class="intro">A small collection, ready to grow.</p>
        </header>

        <div class="gallery-toolbar">
            <button class="add-images-button" id="addImagesButton" type="button">
                <span class="add-icon" aria-hidden="true">+</span>
                <span>Add images</span>
            </button>
            <input id="imagePicker" type="file" accept="image/*" multiple hidden>
            <p class="gallery-count" aria-live="polite"><span id="imageCount">4</span> images</p>
        </div>

        <section class="image-gallery" aria-label="Image gallery">
            <div class="gallery-card">
                <button class="gallery-item" type="button" data-index="0" aria-label="View image 1">
                    <img src="images/img1.png" alt="Gallery image 1" loading="lazy">
                    <span class="image-index">01</span>
                </button>
                <button class="delete-image-button" type="button" aria-label="Remove image 1 from gallery" title="Remove image">&times;</button>
            </div>
            <div class="gallery-card">
                <button class="gallery-item" type="button" data-index="1" aria-label="View image 2">
                    <img src="images/img2.png" alt="Gallery image 2" loading="lazy">
                    <span class="image-index">02</span>
                </button>
                <button class="delete-image-button" type="button" aria-label="Remove image 2 from gallery" title="Remove image">&times;</button>
            </div>
            <div class="gallery-card">
                <button class="gallery-item" type="button" data-index="2" aria-label="View image 3">
                    <img src="images/img3.png" alt="Gallery image 3" loading="lazy">
                    <span class="image-index">03</span>
                </button>
                <button class="delete-image-button" type="button" aria-label="Remove image 3 from gallery" title="Remove image">&times;</button>
            </div>
            <div class="gallery-card">
                <button class="gallery-item" type="button" data-index="3" aria-label="View image 4">
                    <img src="images/img4.png" alt="Gallery image 4" loading="lazy">
                    <span class="image-index">04</span>
                </button>
                <button class="delete-image-button" type="button" aria-label="Remove image 4 from gallery" title="Remove image">&times;</button>
            </div>
            <div class="gallery-card">
                <button class="gallery-item" type="button" data-index="3" aria-label="View image 4">
                    <img src="images/img5.png" alt="Gallery image 4" loading="lazy">
                    <span class="image-index">04</span>
                </button>
                <button class="delete-image-button" type="button" aria-label="Remove image 4 from gallery" title="Remove image">&times;</button>
            </div>
            <div class="gallery-card">
                <button class="gallery-item" type="button" data-index="3" aria-label="View image 4">
                    <img src="images/img6.png" alt="Gallery image 4" loading="lazy">
                    <span class="image-index">04</span>
                </button>
                <button class="delete-image-button" type="button" aria-label="Remove image 4 from gallery" title="Remove image">&times;</button>
            </div>
        </section>
        <p class="gallery-note" id="galleryStatus" role="status">Select an image to view it full size.</p>
    </main>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" aria-hidden="true">
        <button class="lightbox-close" type="button" aria-label="Close image viewer">&times;</button>
        <button class="lightbox-nav lightbox-previous" type="button" aria-label="Previous image">&#8592;</button>
        <figure class="lightbox-figure">
            <img class="lightbox-image" id="lightboxImage" src="" alt="">
            <figcaption><span id="imageCaption"></span><span id="imageCounter"></span></figcaption>
        </figure>
        <button class="lightbox-nav lightbox-next" type="button" aria-label="Next image">&#8594;</button>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
